<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Surprise for You ✨ | ZunaHêu 💖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-primary: #ff5ca8;
      --pink-hot: #f05697;
      --pink-light: #ff9ec7;
      --pink-soft: #ffd6e8;
      --pink-glow: rgba(255, 92, 168, 0.65);
      --gold-glow: rgba(255, 215, 130, 0.7);
      --bg-dark: #090414;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #260b3d 0%, #110521 55%, #06020d 100%);
      font-family: 'Quicksand', sans-serif;
      color: #fff;
      perspective: 1200px;
    }

    /* Fireworks & Interactive Hearts Canvas */
    #fireworksCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: auto;
      cursor: pointer;
    }

    /* Ambient Background Watermark */
    .bg-watermark {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .bg-watermark span {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(5rem, 18vw, 15rem);
      font-weight: 700;
      color: rgba(255, 130, 190, 0.045);
      text-shadow: 0 0 60px rgba(255, 92, 168, 0.12);
      letter-spacing: 0.06em;
      transform: rotate(-8deg);
      animation: watermarkPulse 6s ease-in-out infinite alternate;
      white-space: nowrap;
    }

    @keyframes watermarkPulse {
      0% { transform: rotate(-8deg) scale(0.96); opacity: 0.6; }
      100% { transform: rotate(-5deg) scale(1.04); opacity: 1; }
    }

    /* Main Surprise Container */
    .stage {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      pointer-events: none;
    }

    /* Magical Light Shockwave on Entrance */
    .shockwave {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,92,168,0.7) 40%, transparent 70%);
      box-shadow: 0 0 80px 30px rgba(255, 92, 168, 0.8);
      opacity: 0;
      pointer-events: none;
      animation: shockwaveBurst 1.3s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
    }

    @keyframes shockwaveBurst {
      0% {
        transform: scale(0.2);
        opacity: 1;
      }
      70% {
        opacity: 0.65;
      }
      100% {
        transform: scale(28);
        opacity: 0;
      }
    }

    /* 3D Card Wrapper */
    .cooky-scene {
      position: relative;
      width: clamp(230px, 48vw, 310px);
      height: clamp(230px, 48vw, 310px);
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      pointer-events: auto;
      cursor: pointer;
      opacity: 0;
      animation: popIn3D 1.25s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards;
    }

    @keyframes popIn3D {
      0% {
        opacity: 0;
        transform: translate3d(0, 90px, -400px) scale(0.15) rotateX(45deg) rotateY(-180deg) rotateZ(-15deg);
        filter: brightness(2.5) blur(10px);
      }
      55% {
        opacity: 1;
        filter: brightness(1.3) blur(0px);
      }
      78% {
        transform: translate3d(0, -12px, 40px) scale(1.08) rotateX(-8deg) rotateY(10deg) rotateZ(3deg);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1) rotateX(0deg) rotateY(0deg) rotateZ(0deg);
        filter: brightness(1) blur(0px);
      }
    }

    /* Continuous 3D Floating + Interactive Tilt Target */
    .cooky-card-3d {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 36px;
      transform-style: preserve-3d;
      transition: transform 0.18s ease-out, box-shadow 0.3s ease;
      animation: floatIdle 3.6s ease-in-out 1.45s infinite;
    }

    @keyframes floatIdle {
      0%, 100% {
        transform: translateY(0px) rotateZ(0deg) scale(1);
      }
      25% {
        transform: translateY(-12px) rotateZ(-2deg) scale(1.02);
      }
      50% {
        transform: translateY(-4px) rotateZ(1.5deg) scale(1.03);
      }
      75% {
        transform: translateY(-14px) rotateZ(-1deg) scale(1.015);
      }
    }

    /* Rotating Halo Rings Behind Cooky */
    .halo-ring {
      position: absolute;
      inset: -18px;
      border-radius: 46px;
      background: conic-gradient(
        from 0deg,
        #ff5ca8,
        #ffd166,
        #ff9ec7,
        #c77dff,
        #ff5ca8
      );
      filter: blur(18px);
      opacity: 0.85;
      transform: translateZ(-30px);
      animation: spinHalo 6s linear infinite;
    }

    .halo-ring-outer {
      position: absolute;
      inset: -32px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 180, 215, 0.45);
      box-shadow: 0 0 35px rgba(255, 92, 168, 0.5);
      transform: translateZ(-20px);
      animation: spinReverse 14s linear infinite;
      pointer-events: none;
    }

    @keyframes spinHalo {
      0% { transform: translateZ(-30px) rotate(0deg) scale(0.96); }
      50% { transform: translateZ(-30px) rotate(180deg) scale(1.05); }
      100% { transform: translateZ(-30px) rotate(360deg) scale(0.96); }
    }

    @keyframes spinReverse {
      0% { transform: translateZ(-20px) rotate(360deg); }
      100% { transform: translateZ(-20px) rotate(0deg); }
    }

    /* Cooky Image Frame */
    .cooky-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 34px;
      overflow: hidden;
      background: #f05697;
      border: 4px solid rgba(255, 255, 255, 0.85);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.55),
        0 0 40px rgba(255, 92, 168, 0.75),
        inset 0 0 24px rgba(255, 255, 255, 0.45);
      transform: translateZ(20px);
    }

    .cooky-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform-origin: center bottom;
      animation: cookyPump 1.6s ease-in-out 1.4s infinite;
    }

    /* Energetic Dumbbell Pump Bounce on Cooky */
    @keyframes cookyPump {
      0%, 100% {
        transform: scale(1) translateY(0);
      }
      40% {
        transform: scale(1.045, 0.97) translateY(3px);
      }
      70% {
        transform: scale(0.98, 1.05) translateY(-5px) rotate(-1.5deg);
      }
    }

    /* Glossy Shimmer Sweep Over Frame */
    .cooky-frame::after {
      content: "";
      position: absolute;
      top: -60%;
      left: -60%;
      width: 60%;
      height: 220%;
      background: linear-gradient(
        to right,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.45) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(30deg);
      animation: shimmerSweep 3.5s ease-in-out 1.2s infinite;
      pointer-events: none;
    }

    @keyframes shimmerSweep {
      0% { left: -70%; opacity: 0; }
      20% { opacity: 1; }
      50%, 100% { left: 140%; opacity: 0; }
    }

    /* 3D Pop-out Floating Badges Around Cooky */
    .badge-3d {
      position: absolute;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      filter: drop-shadow(0 6px 12px rgba(255, 50, 140, 0.6));
      transform: translateZ(55px);
      pointer-events: none;
      animation: badgeBounce 2.4s ease-in-out infinite alternate;
    }

    .badge-tl { top: -16px; left: -16px; animation-delay: 0.1s; }
    .badge-tr { top: -18px; right: -14px; animation-delay: 0.5s; }
    .badge-bl { bottom: -14px; left: -12px; animation-delay: 0.9s; }
    .badge-br { bottom: -16px; right: -16px; animation-delay: 0.3s; }

    @keyframes badgeBounce {
      0% { transform: translateZ(55px) translateY(0) scale(0.92) rotate(-8deg); }
      100% { transform: translateZ(55px) translateY(-10px) scale(1.15) rotate(10deg); }
    }

    /* Text & Romantic Message Card */
    .message-box {
      margin-top: clamp(22px, 4vh, 34px);
      text-align: center;
      max-width: 540px;
      padding: 20px 28px;
      border-radius: 28px;
      background: rgba(28, 10, 46, 0.55);
      border: 1.5px solid rgba(255, 158, 199, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow:
        0 16px 40px rgba(0, 0, 0, 0.4),
        0 0 30px rgba(255, 92, 168, 0.25);
      opacity: 0;
      transform: translateY(30px) scale(0.92);
      animation: revealMessage 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.85s forwards;
      pointer-events: auto;
    }

    @keyframes revealMessage {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .title-greeting {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      color: #fff;
      text-shadow:
        0 0 12px var(--pink-primary),
        0 0 28px var(--pink-primary),
        0 2px 4px rgba(0, 0, 0, 0.5);
      margin-bottom: 8px;
      line-height: 1.15;
    }

    .title-greeting .highlight-name {
      background: linear-gradient(90deg, #ff9ec7, #ffe066, #ff5ca8, #ff9ec7);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shineName 3s linear infinite;
      padding: 0 4px;
    }

    @keyframes shineName {
      to { background-position: 200% center; }
    }

    .subtitle-text {
      font-size: clamp(0.98rem, 2.6vw, 1.16rem);
      font-weight: 600;
      color: var(--pink-soft);
      line-height: 1.6;
      min-height: 3.2em;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
    }

    /* Interactive Love Button */
    .actions-row {
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-love {
      border: none;
      outline: none;
      cursor: pointer;
      padding: 11px 24px;
      border-radius: 999px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.98rem;
      color: #fff;
      background: linear-gradient(135deg, #ff4d94 0%, #ff85b3 50%, #ff4d94 100%);
      background-size: 200% auto;
      box-shadow:
        0 6px 20px rgba(255, 77, 148, 0.55),
        inset 0 2px 4px rgba(255, 255, 255, 0.45);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, background-position 0.4s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-love:hover {
      background-position: right center;
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 10px 26px rgba(255, 77, 148, 0.8);
    }

    .btn-love:active {
      transform: translateY(1px) scale(0.96);
    }

    /* Subtle Hint Footer */
    .tap-hint {
      margin-top: 14px;
      font-size: 0.82rem;
      color: rgba(255, 214, 232, 0.72);
      letter-spacing: 0.03em;
      animation: hintBlink 2.4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes hintBlink {
      0%, 100% { opacity: 0.45; transform: translateY(0); }
      50% { opacity: 0.95; transform: translateY(-2px); }
    }

    /* Pop-up Floating Emoji on Click */
    .click-pop {
      position: fixed;
      z-index: 20;
      pointer-events: none;
      font-weight: 700;
      font-size: 1.35rem;
      color: #fff;
      text-shadow: 0 0 12px var(--pink-primary);
      animation: floatUpPop 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes floatUpPop {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.4) rotate(-10deg);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -110%) scale(1.2) rotate(6deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -180%) scale(0.9) rotate(-4deg);
      }
    }

    /* Mobile-only lightweight overrides so Mobile stays lag-free while PC gets full effects */
    @media (max-width: 767px) {
      .halo-ring {
        filter: none;
        background: radial-gradient(circle, rgba(255, 92, 168, 0.6) 0%, transparent 70%);
        animation: none;
      }
      .message-box {
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        background: rgba(28, 10, 46, 0.85);
      }
    }
  </style>
</head>
<body>

  <!-- Fireworks & Interactive Hearts Canvas -->
  <canvas id="fireworksCanvas"></canvas>

  <!-- Ambient Watermark -->
  <div class="bg-watermark">
    <span>ZunaHêu</span>
  </div>

  <!-- Center Stage -->
  <main class="stage">
    <div class="shockwave"></div>

    <!-- 3D Pop-up Cooky Card -->
    <div class="cooky-scene" id="cookyScene" title="Bấm vào Cooky để nạp năng lượng yêu thương nhé! 💪💖">
      <div class="cooky-card-3d" id="cookyCard">
        <div class="halo-ring"></div>
        <div class="halo-ring-outer"></div>
        <div class="cooky-frame">
          <img src="cooky.png" alt="Cute Cooky Lifting Weights for ZunaHêu" />
        </div>
        <span class="badge-3d badge-tl">💖</span>
        <span class="badge-3d badge-tr">✨</span>
        <span class="badge-3d badge-bl">💪</span>
        <span class="badge-3d badge-br">🌸</span>
      </div>
    </div>

    <!-- Sweet Greeting Message -->
    <section class="message-box">
      <h1 class="title-greeting">
        Gửi <span class="highlight-name">ZunaHêu</span> đáng yêu ✨
      </h1>
      <p class="subtitle-text" id="typewriterText"></p>
      <div class="actions-row">
        <button class="btn-love" id="btnBurstLove" type="button">
          <span>Bắn ngàn trái tim cho em</span>
          <span>💝</span>
        </button>
      </div>
    </section>

    <p class="tap-hint">✨ Chạm vào bất kỳ đâu trên màn hình hoặc bé Cooky để bắn pháo hoa & thả tim nhé! ✨</p>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('fireworksCanvas');
      const ctx = canvas.getContext('2d');

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);
      let isMobile = width < 768;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        isMobile = width < 768;
      });

      // Romantic Color Palette
      const COLORS = [
        '#ff5ca8', // Hot Pink
        '#ff9ec7', // Pastel Pink
        '#ffd166', // Warm Gold
        '#ff3377', // Ruby Rose
        '#e0aaff', // Soft Lavender
        '#72efdd', // Mint Sparkle
        '#ffffff'  // Pure White Star
      ];

      const SWEET_WORDS = [
        'Yêu em 💖',
        'ZunaHêu ✨',
        'So Cute 🐰',
        'Cố lên nhé 💪',
        'Thương thương 💕',
        'Mãi bên nhau 🌸',
        'Chụt chụt 😘'
      ];

      // Background Twinkling Stars & Floating Ambient Hearts
      const stars = [];
      const bgHearts = [];

      function initAmbient() {
        stars.length = 0;
        bgHearts.length = 0;
        const starCount = isMobile ? 25 : Math.min(90, Math.floor((width * height) / 14000));
        for (let i = 0; i < starCount; i++) {
          stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            r: Math.random() * 1.8 + 0.4,
            alpha: Math.random(),
            speed: Math.random() * 0.025 + 0.008
          });
        }
        const heartCount = isMobile ? 6 : 18;
        for (let i = 0; i < heartCount; i++) {
          bgHearts.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 12 + 7,
            vy: -(Math.random() * 0.55 + 0.25),
            vx: (Math.random() - 0.5) * 0.4,
            alpha: Math.random() * 0.35 + 0.12,
            phase: Math.random() * Math.PI * 2
          });
        }
      }
      initAmbient();

      // Helper to draw a heart shape on canvas
      function drawHeartPath(ctx, x, y, size) {
        ctx.beginPath();
        const topCurveHeight = size * 0.3;
        ctx.moveTo(x, y + topCurveHeight);
        // top left curve
        ctx.bezierCurveTo(
          x, y,
          x - size / 2, y,
          x - size / 2, y + topCurveHeight
        );
        // bottom left curve
        ctx.bezierCurveTo(
          x - size / 2, y + (size + topCurveHeight) / 2,
          x, y + (size + topCurveHeight) / 1.45,
          x, y + size
        );
        // bottom right curve
        ctx.bezierCurveTo(
          x, y + (size + topCurveHeight) / 1.45,
          x + size / 2, y + (size + topCurveHeight) / 2,
          x + size / 2, y + topCurveHeight
        );
        // top right curve
        ctx.bezierCurveTo(
          x + size / 2, y,
          x, y,
          x, y + topCurveHeight
        );
        ctx.closePath();
      }

      // Firework Rocket Class
      class Rocket {
        constructor(startX, startY, targetX, targetY, isHeartBurst = false) {
          this.x = startX;
          this.y = startY;
          this.targetX = targetX;
          this.targetY = targetY;
          this.isHeartBurst = isHeartBurst;
          this.color = COLORS[Math.floor(Math.random() * COLORS.length)];

          const angle = Math.atan2(targetY - startY, targetX - startX);
          const dist = Math.hypot(targetX - startX, targetY - startY);
          const speed = Math.min(17, Math.max(9, dist / 22));

          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.trail = [];
          this.done = false;
        }

        update() {
          this.trail.push({ x: this.x, y: this.y });
          if (this.trail.length > 8) this.trail.shift();

          this.x += this.vx;
          this.y += this.vy;

          const distRemaining = Math.hypot(this.targetX - this.x, this.targetY - this.y);
          if (distRemaining < 18 || (this.vy > 0 && this.y <= this.targetY)) {
            this.done = true;
            createExplosion(this.targetX, this.targetY, this.color, this.isHeartBurst);
          }
        }

        draw() {
          for (let i = 0; i < this.trail.length; i++) {
            const p = this.trail[i];
            const ratio = (i + 1) / this.trail.length;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 2.6 * ratio, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.globalAlpha = ratio * 0.75;
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }
      }

      // Explosion Particle Class
      class Particle {
        constructor(x, y, vx, vy, color, shape = 'circle', size = 3.2) {
          this.x = x;
          this.y = y;
          this.vx = vx;
          this.vy = vy;
          this.color = color;
          this.shape = shape;
          this.size = size;
          this.alpha = 1;
          this.decay = Math.random() * 0.014 + 0.011;
          this.gravity = 0.065;
          this.friction = 0.968;
          this.flicker = Math.random() > 0.35;
        }

        update() {
          this.vx *= this.friction;
          this.vy *= this.friction;
          this.vy += this.gravity;
          this.x += this.vx;
          this.y += this.vy;
          this.alpha -= this.decay;
        }

        draw() {
          if (this.alpha <= 0) return;
          ctx.save();
          ctx.globalAlpha = this.flicker
            ? Math.max(0, this.alpha * (0.65 + Math.random() * 0.35))
            : Math.max(0, this.alpha);
          ctx.fillStyle = this.color;
          if (!isMobile) {
            ctx.shadowBlur = 12;
            ctx.shadowColor = this.color;
          }

          if (this.shape === 'heart') {
            drawHeartPath(ctx, this.x, this.y - this.size / 2, this.size);
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      const rockets = [];
      const particles = [];

      function createExplosion(x, y, mainColor, isHeartBurst = false) {
        if (isMobile && particles.length > 70) {
          particles.splice(0, 25);
        }
        if (isHeartBurst) {
          // Parametric Heart-shaped Firework Burst
          const count = isMobile ? 22 : 58;
          const scale = Math.random() * 0.14 + 0.25;
          for (let i = 0; i < count; i++) {
            const t = (Math.PI * 2 * i) / count;
            const hx = 16 * Math.pow(Math.sin(t), 3);
            const hy = -(
              13 * Math.cos(t) -
              5 * Math.cos(2 * t) -
              2 * Math.cos(3 * t) -
              Math.cos(4 * t)
            );
            const color = i % 3 === 0 ? '#ffffff' : mainColor;
            particles.push(
              new Particle(
                x,
                y,
                hx * scale + (Math.random() - 0.5) * 0.4,
                hy * scale + (Math.random() - 0.5) * 0.4,
                color,
                i % 2 === 0 ? 'heart' : 'circle',
                i % 2 === 0 ? 9 : 3.2
              )
            );
          }
        } else {
          // Radiant Spherical + Mini-Heart Firework Burst
          const count = isMobile ? 24 : 68;
          const secondaryColor = COLORS[Math.floor(Math.random() * COLORS.length)];
          for (let i = 0; i < count; i++) {
            const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.15;
            const speed = Math.random() * 5.8 + 1.8;
            const isHeart = Math.random() < 0.35;
            const c = i % 3 === 0 ? secondaryColor : i % 7 === 0 ? '#ffffff' : mainColor;
            particles.push(
              new Particle(
                x,
                y,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                c,
                isHeart ? 'heart' : 'circle',
                isHeart ? Math.random() * 5 + 7 : Math.random() * 2.2 + 1.8
              )
            );
          }
        }
      }

      // Launch initial Grand Entrance Fireworks Salvo immediately on page load!
      function launchEntranceSalvo() {
        const cx = width / 2;
        const cy = height * 0.38;

        // Instant center burst synchronized with Cooky 3D pop-in
        setTimeout(() => {
          createExplosion(cx, cy, '#ff5ca8', true);
          if (!isMobile) createExplosion(cx, cy, '#ffd166', false);
        }, 180);

        const salvoPositions = isMobile
          ? [
              { tx: width * 0.25, ty: height * 0.26, delay: 420, heart: true },
              { tx: width * 0.75, ty: height * 0.26, delay: 800, heart: false },
              { tx: width * 0.5,  ty: height * 0.18, delay: 1200, heart: true }
            ]
          : [
              { tx: width * 0.22, ty: height * 0.28, delay: 320, heart: true },
              { tx: width * 0.78, ty: height * 0.28, delay: 460, heart: true },
              { tx: width * 0.32, ty: height * 0.18, delay: 680, heart: false },
              { tx: width * 0.68, ty: height * 0.18, delay: 840, heart: false },
              { tx: width * 0.5,  ty: height * 0.16, delay: 1050, heart: true },
              { tx: width * 0.18, ty: height * 0.42, delay: 1280, heart: false },
              { tx: width * 0.82, ty: height * 0.42, delay: 1450, heart: true }
            ];

        salvoPositions.forEach((p) => {
          setTimeout(() => {
            rockets.push(new Rocket(width * (0.35 + Math.random() * 0.3), height, p.tx, p.ty, p.heart));
          }, p.delay);
        });
      }

      launchEntranceSalvo();

      // Periodic Ambient Fireworks so the sky stays alive and magical
      setInterval(() => {
        if (document.hidden) return;
        if (isMobile && particles.length > 40) return;
        const startX = width * (0.2 + Math.random() * 0.6);
        const targetX = width * (0.12 + Math.random() * 0.76);
        const targetY = height * (0.12 + Math.random() * 0.42);
        rockets.push(new Rocket(startX, height, targetX, targetY, Math.random() < 0.55));
      }, isMobile ? 2800 : 1600);

      // Spawn Floating Sweet Text on Click
      function spawnFloatingWord(x, y) {
        const el = document.createElement('div');
        el.className = 'click-pop';
        el.textContent = SWEET_WORDS[Math.floor(Math.random() * SWEET_WORDS.length)];
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1100);
      }

      // Interactive Click / Touch Anywhere
      function triggerInteractiveBurst(clientX, clientY, extraBig = false) {
        const color = COLORS[Math.floor(Math.random() * COLORS.length)];
        createExplosion(clientX, clientY, color, true);
        if (extraBig && !isMobile) {
          setTimeout(() => createExplosion(clientX, clientY, '#ffd166', false), 120);
        }
        spawnFloatingWord(clientX, clientY);
      }

      window.addEventListener('pointerdown', (e) => {
        if (e.target.closest('#btnBurstLove')) return;
        triggerInteractiveBurst(e.clientX, e.clientY);
      });

      // Cooky Card 3D Perspective Tilt + Extra Click Bounce
      const cookyScene = document.getElementById('cookyScene');
      const cookyCard = document.getElementById('cookyCard');

      window.addEventListener('pointermove', (e) => {
        if (isMobile) return;
        const rect = cookyScene.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const deltaX = (e.clientX - centerX) / (window.innerWidth / 2);
        const deltaY = (e.clientY - centerY) / (window.innerHeight / 2);

        const rotateY = Math.max(-22, Math.min(22, deltaX * 20));
        const rotateX = Math.max(-22, Math.min(22, -deltaY * 20));

        cookyCard.style.animation = 'none';
        cookyCard.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.04, 1.04, 1.04)`;

        // Trail of tiny hearts when moving cursor on PC
        if (Math.random() < 0.28) {
          particles.push(
            new Particle(
              e.clientX,
              e.clientY,
              (Math.random() - 0.5) * 1.8,
              -Math.random() * 2.2 - 0.5,
              COLORS[Math.floor(Math.random() * COLORS.length)],
              'heart',
              Math.random() * 4 + 6
            )
          );
        }
      });

      window.addEventListener('pointerleave', () => {
        cookyCard.style.transform = '';
        cookyCard.style.animation = 'floatIdle 3.6s ease-in-out infinite';
      });

      // Click on Cooky Card -> Super Energy Boost!
      cookyScene.addEventListener('pointerdown', () => {
        const rect = cookyScene.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        createExplosion(cx, cy, '#ff5ca8', true);
        if (!isMobile) createExplosion(cx, cy, '#ffd166', false);
        cookyCard.animate(
          [
            { transform: 'scale3d(1, 1, 1) rotateZ(0deg)' },
            { transform: 'scale3d(1.18, 0.86, 1.1) rotateZ(-6deg)' },
            { transform: 'scale3d(0.92, 1.14, 1.1) rotateZ(6deg)' },
            { transform: 'scale3d(1.06, 0.97, 1.05) rotateZ(-2deg)' },
            { transform: 'scale3d(1, 1, 1) rotateZ(0deg)' }
          ],
          { duration: 620, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' }
        );
      });

      // Button: "Bắn ngàn trái tim cho em"
      document.getElementById('btnBurstLove').addEventListener('click', (e) => {
        e.stopPropagation();
        const burstTotal = isMobile ? 3 : 8;
        for (let i = 0; i < burstTotal; i++) {
          setTimeout(() => {
            const tx = width * (0.15 + Math.random() * 0.7);
            const ty = height * (0.15 + Math.random() * 0.45);
            createExplosion(tx, ty, COLORS[i % COLORS.length], true);
            if (i % 2 === 0) spawnFloatingWord(tx, ty);
          }, i * (isMobile ? 220 : 140));
        }
      });

      // Romantic Typewriter Message
      const message =
        'Bé Cooky lực sĩ mang ngàn trái tim và năng lượng tích cực đến cho ZunaHêu đây! Chúc công chúa của anh luôn rạng rỡ, vui vẻ và hạnh phúc mỗi ngày nhé! Yêu em thật nhiều! 🐰💪💖';
      const typewriterEl = document.getElementById('typewriterText');
      let charIdx = 0;

      function startTypewriter() {
        const timer = setInterval(() => {
          if (charIdx < message.length) {
            typewriterEl.textContent += message.charAt(charIdx);
            charIdx++;
          } else {
            clearInterval(timer);
          }
        }, 32);
      }
      setTimeout(startTypewriter, 1100);

      // Main Animation Loop
      function animate() {
        requestAnimationFrame(animate);

        // Soft motion trail clear
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(12, 4, 24, 0.24)';
        ctx.fillRect(0, 0, width, height);

        // Draw twinkling stars
        for (const s of stars) {
          s.alpha += s.speed;
          const a = (Math.sin(s.alpha) + 1) * 0.35 + 0.15;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 220, 240, ${a})`;
          ctx.fill();
        }

        // Draw floating background hearts
        for (const h of bgHearts) {
          h.y += h.vy;
          h.x += Math.sin((h.phase += 0.02)) * 0.35 + h.vx;
          if (h.y < -30) {
            h.y = height + 20;
            h.x = Math.random() * width;
          }
          ctx.save();
          ctx.globalAlpha = h.alpha;
          ctx.fillStyle = '#ff7eb9';
          drawHeartPath(ctx, h.x, h.y, h.size);
          ctx.fill();
          ctx.restore();
        }

        // Additive blending for glowing fireworks
        ctx.globalCompositeOperation = 'lighter';

        for (let i = rockets.length - 1; i >= 0; i--) {
          rockets[i].update();
          rockets[i].draw();
          if (rockets[i].done) rockets.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          particles[i].update();
          particles[i].draw();
          if (particles[i].alpha <= 0) particles.splice(i, 1);
        }
      }

      animate();
    })();
  </script>
</body>
</html>
